<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop Agent</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --sidebar-bg: #16213e;
            --chat-bg: #0f3460;
            --msg-user: #1a508b;
            --msg-ai: #2a2a4a;
            --text: #e0e0e0;
            --text-secondary: #a0a0b0;
            --accent: #00d2ff;
            --accent2: #7b2ff7;
            --input-bg: #1e1e3a;
            --border: #2a2a4a;
            --danger: #ff6b6b;
            --success: #51cf66;
            --warning: #ffd43b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header h2 {
            font-size: 18px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sidebar-header p { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
        .conversation-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .conv-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 4px;
            font-size: 13px;
            color: var(--text-secondary);
            transition: all .2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-item:hover, .conv-item.active {
            background: var(--chat-bg);
            color: var(--text);
        }
        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid var(--border);
        }
        .btn-new-chat {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity .2s;
        }
        .btn-new-chat:hover { opacity: 0.85; }

        /* Main chat area */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-header h3 { font-size: 15px; font-weight: 500; }
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--success);
        }
        .status-dot.thinking {
            background: var(--warning);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .msg {
            display: flex;
            gap: 10px;
            max-width: 85%;
            animation: fadeIn .3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.ai { align-self: flex-start; }
        .msg-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .msg.user .msg-avatar { background: var(--accent2); }
        .msg.ai .msg-avatar { background: var(--accent); }
        .msg-bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg.user .msg-bubble { background: var(--msg-user); border-bottom-right-radius: 4px; }
        .msg.ai .msg-bubble { background: var(--msg-ai); border-bottom-left-radius: 4px; }
        .msg-tool {
            align-self: flex-start;
            font-size: 12px;
            color: var(--warning);
            padding: 4px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Thinking indicator */
        .thinking-indicator {
            align-self: flex-start;
            display: flex; align-items: center; gap: 8px;
            padding: 8px 16px;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .thinking-dots { display: flex; gap: 3px; }
        .thinking-dots span {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--accent);
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input area */
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
        }
        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .input-row textarea {
            flex: 1;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            outline: none;
            transition: border-color .2s;
        }
        .input-row textarea:focus { border-color: var(--accent); }
        .input-row textarea::placeholder { color: #555; }
        .btn-send {
            width: 44px; height: 44px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
            transition: opacity .2s, transform .2s;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-send:hover { opacity: 0.85; }
        .btn-send:active { transform: scale(0.95); }
        .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

        .confirm-row {
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .confirm-row input { accent-color: var(--accent); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* Error banner */
        .error-banner {
            margin: 10px 20px;
            padding: 10px 16px;
            background: rgba(255, 107, 107, 0.15);
            border: 1px solid var(--danger);
            border-radius: 8px;
            color: var(--danger);
            font-size: 13px;
            display: none;
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-header">
        <h2>Desktop Agent</h2>
        <p>DeepSeek · v4-flash</p>
    </div>
    <div class="conversation-list" id="convList"></div>
    <div class="sidebar-footer">
        <button class="btn-new-chat" onclick="newChat()">+ 新对话</button>
    </div>
</aside>

<main class="main">
    <header class="chat-header">
        <h3 id="chatTitle">Desktop Agent 对话</h3>
        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">就绪</span>
        </div>
    </header>

    <div class="error-banner" id="errorBanner"></div>

    <div class="messages" id="messages">
        <div style="text-align:center;color:var(--text-secondary);margin-top:60px;font-size:14px;">
            <div style="font-size:48px;margin-bottom:16px;">&#x1F4BB;</div>
            <p>Desktop Agent 已就绪</p>
            <p style="font-size:12px;margin-top:4px;">可以读取文件、打开软件、模拟键盘输入</p>
        </div>
    </div>

    <div class="input-area">
        <div class="input-row">
            <textarea id="userInput" rows="1" placeholder="输入消息，例如：看看桌面上有什么文件..."
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
            <button class="btn-send" id="btnSend" onclick="sendMessage()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
        </div>
        <div class="confirm-row">
            <input type="checkbox" id="confirmCheck" checked>
            <label for="confirmCheck">确认执行工具操作</label>
        </div>
    </div>
</main>

<script>
const API_BASE = window.location.hostname === 'localhost' || window.location.port === '8123'
    ? '/api'
    : 'http://localhost:8123/api';
let currentConvId = null;
let isStreaming = false;

function $(id) { return document.getElementById(id); }

function setStatus(state) {
    const dot = $('statusDot');
    const text = $('statusText');
    dot.className = 'status-dot';
    text.textContent = state;
    switch(state) {
        case 'thinking': dot.classList.add('thinking'); text.textContent = 'AI 思考中...'; break;
        case 'streaming': text.textContent = '接收回复中...'; break;
        case 'done': case '就绪': text.textContent = '就绪'; break;
        default: text.textContent = state;
    }
}

function showError(msg) {
    const banner = $('errorBanner');
    banner.textContent = msg;
    banner.style.display = 'block';
    setTimeout(() => { banner.style.display = 'none'; }, 6000);
}

function addMessage(role, content, avatar) {
    const msgs = $('messages');
    // Remove welcome placeholder
    const placeholder = msgs.querySelector('div[style]');
    if (placeholder && msgs.children.length === 1) placeholder.remove();

    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.innerHTML = `<div class="msg-avatar">${avatar}</div><div class="msg-bubble"></div>`;
    div.querySelector('.msg-bubble').textContent = content;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div.querySelector('.msg-bubble');
}

function addTool(msg) {
    const msgs = $('messages');
    const div = document.createElement('div');
    div.className = 'msg-tool';
    div.textContent = '🔧 ' + msg;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
}

function addThinking() {
    const msgs = $('messages');
    const div = document.createElement('div');
    div.className = 'thinking-indicator';
    div.id = 'thinkingEl';
    div.innerHTML = '思考中 <div class="thinking-dots"><span></span><span></span><span></span></div>';
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
}

function removeThinking() {
    const el = $('thinkingEl');
    if (el) el.remove();
}

async function sendMessage() {
    if (isStreaming) return;
    const input = $('userInput');
    const message = input.value.trim();
    if (!message) return;

    isStreaming = true;
    $('btnSend').disabled = true;
    input.value = '';
    input.style.height = 'auto';

    addMessage('user', message, '👤');
    addThinking();
    setStatus('thinking');

    const aiBubble = addMessage('ai', '', '🤖');
    let fullText = '';

    try {
        const response = await fetch(API_BASE + '/chat/stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
            body: JSON.stringify({
                message: message,
                confirm: $('confirmCheck').checked,
                conversationId: currentConvId
            })
        });

        if (!response.ok) throw new Error('HTTP ' + response.status + ': ' + response.statusText);

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            let eventType = '';
            for (const line of lines) {
                if (line.startsWith('event:')) {
                    eventType = line.slice(6).trim();
                } else if (line.startsWith('data:')) {
                    const data = line.slice(5).trim();
                    if (!data) continue;
                    try {
                        const event = JSON.parse(data);
                        handleEvent(eventType || (event.type), event, aiBubble);
                        if (eventType === 'done' || event.type === 'done') {
                            currentConvId = event.data?.conversationId || event.conversationId;
                        }
                        eventType = '';
                    } catch(e) {
                        // Non-JSON data, treat as message chunk
                        aiBubble.textContent += data;
                        fullText += data;
                        aiBubble.parentElement.scrollIntoView({ behavior: 'smooth' });
                    }
                }
            }
        }
    } catch (err) {
        removeThinking();
        showError('连接失败: ' + err.message);
        if (aiBubble && !aiBubble.textContent) aiBubble.textContent = '[请求失败]';
    } finally {
        removeThinking();
        isStreaming = false;
        $('btnSend').disabled = false;
        setStatus('就绪');
        $('userInput').focus();
    }
}

function handleEvent(type, event, aiBubble) {
    switch(type) {
        case 'thinking':
            setStatus('thinking');
            break;
        case 'tool_call':
            setStatus('streaming');
            const tool = event.data?.tool || (typeof event.data === 'string' ? event.data : JSON.stringify(event.data));
            addTool('调用工具: ' + tool);
            break;
        case 'tool_result':
            addTool('工具执行完成');
            break;
        case 'message':
            setStatus('streaming');
            const text = typeof event.data === 'string' ? event.data : (event.data?.content || '');
            aiBubble.textContent += text;
            aiBubble.parentElement.scrollIntoView({ behavior: 'smooth' });
            break;
        case 'done':
            setStatus('done');
            break;
        case 'error':
            showError(typeof event.data === 'string' ? event.data : (event.data?.message || '未知错误'));
            setStatus('错误');
            break;
    }
}

function newChat() {
    if (isStreaming) return;
    currentConvId = null;
    $('messages').innerHTML = `<div style="text-align:center;color:var(--text-secondary);margin-top:60px;font-size:14px;">
        <div style="font-size:48px;margin-bottom:16px;">&#x1F4BB;</div>
        <p>Desktop Agent 已就绪</p>
        <p style="font-size:12px;margin-top:4px;">可以读取文件、打开软件、模拟键盘输入</p>
    </div>`;
    $('chatTitle').textContent = 'Desktop Agent 对话';
    $('userInput').focus();
}

// Auto-resize textarea
$('userInput').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// Focus input on load
$('userInput').focus();
</script>
</body>
</html>
