spring:
  application:
    name: Agent_demo
  profiles:
    active: dev
  ai:
    # 远程 LLM（DeepSeek，仅对话，不做 Embedding）
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.7
    # 本地 Embedding（ONNX），零网络延迟
    model:
      embedding: transformers
    embedding:
      transformer:
        cache:
          directory: D:/agent/.cache/onnx-models
        onnx:
          modelUri: https://hf-mirror.com/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx
        tokenizer:
          uri: https://hf-mirror.com/sentence-transformers/all-MiniLM-L6-v2/raw/main/tokenizer.json
          options:
            padding: true
    vectorstore:
      chroma:
        initialize-schema: true
        collection-name: agent_docs
        client:
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8000}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.limou.agent_demo.entity
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.limou.agent_demo.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

agent:
  rag:
    enabled: true
    docs-path: D:/agent/docs
    manifest-path: D:/agent/docs/rag-manifest.json
    chunk-size: 900
    chunk-overlap: 120
    top-k: 5
    min-score: 0.35
    rebuild-on-startup: false
    auto-index-on-startup: true
    batch-size: 20
    # 文件工具安全白名单
    safety:
      allowed-paths: ${user.home},${user.dir},C:/,D:/,E:/,F:/,G:/,H:/
    extensions:
      - .md
      - .txt
