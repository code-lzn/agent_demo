spring:
  application:
    name: Agent_demo
  profiles:
    active: dev
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.7
      embedding:
        base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        api-key: ${EMBEDDING_API_KEY:${DASHSCOPE_API_KEY:}}
        model: ${EMBEDDING_MODEL:text-embedding-v4}
    vectorstore:
      chroma:
        initialize-schema: true
        collection-name: agent_docs
        client:
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8000}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.limou.agent_demo.entity
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.limou.agent_demo.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

agent:
  rag:
    enabled: true
    docs-path: D:/agent/docs
    manifest-path: D:/agent/docs/rag-manifest.json
    chunk-size: 900
    chunk-overlap: 120
    top-k: 5
    min-score: 0.0
    rebuild-on-startup: false
    auto-index-on-startup: true
    batch-size: 20
    # 文件工具安全白名单
    safety:
      allowed-paths: ${user.home},${user.dir},C:/,D:/,E:/,F:/,G:/,H:/
    extensions:
      - .md
      - .txt
